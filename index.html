<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cinemTop"></div>
    <div class="cinemBottom"></div>

    <main class="site">
        <header id="cityID" class="topBar">
        </header>

        <div class="weatherContent">
            <div class="big-box">
                <div class="search-box">
                    <div class="count-locate">
                        <img src="img/locate.svg" alt="locate" class="ico-locate"">
                        <input class="input-city" type="text" placeholder="Digite o nome da cidade" value="paris">
            
                    </div>
                    <button id="button" class="button" onclick="voiceDetection()">
                        <img src="img/microfone.svg" alt="Microfone" style="filter: invert(100%);">
                    </button>
                    <button id="pesquisar" class="button" onclick="buttonClick()">
                        <img src="img/lupa.svg" alt="buscar" style="filter: invert(100%);">
                    </button>
                </div>
                <div class="hr-box" id="hr-box">
                    <p class="dia"></p>
                    <h2 class="hora"></h2>
            
                </div>
                <div class="medium-box">
                </div>
                <div class="clock" id="clock">
                    <div class="clock-img">
                        <img src="img/clock.png" alt="clock">
                    </div>
                    <div class="hours">
                        <span class="hr" id="hr"></span>
                    </div>
                    <div class="minutes">
                        <span class="min" id="min"></span>
                    </div>
                    <div class="seconds">
                        <span class="sec" id="sec"></span>
                    </div>
            
                    <div class="hr-clock" id="hr-clock">
            
                    </div>
                </div>
            </div>
        </div>

        <footer class="bottomBar">
            <span><img src="img/cloud.svg" style="opacity: 0.7; transform: scale(0.7); filter: invert(100%);">CONDIÇÕES ATUAIS</span>
            <span><i class="sla"></i>ATUALIZADO AGORA</span>
        </footer>
    </main>


    <script src="script.js"></script>
</body>
</html>
